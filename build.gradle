plugins {
    id 'java'
    id 'eclipse'
}

// The Starsector API is not published anywhere - it ships with the game.
// Point `starsectorDir` (in gradle.properties, or -PstarsectorDir=...) at your game install
// and the build compiles against whatever version of the game you have installed.
def starsectorDir = file(findProperty('starsectorDir') ?: 'C:/Program Files (x86)/Fractal Softworks/Starsector')
def starsectorCore = new File(starsectorDir, 'starsector-core')
def starsectorApi = new File(starsectorCore, 'starfarer.api.jar')

if (!starsectorApi.exists()) {
    throw new GradleException("Starsector API not found at ${starsectorApi}. " +
            "Set starsectorDir in gradle.properties to your Starsector install folder.")
}

repositories {
    mavenCentral()
}

// fix documentation
eclipse {
    classpath {
        file {
            whenMerged {
                def lib = entries.find { it.path.contains 'starfarer.api.jar' }
                if (lib != null) {
                    lib.javadocPath = fileReference(new File(starsectorCore, 'starfarer.api.zip'))
                    lib.sourcePath = fileReference(new File(starsectorCore, 'starfarer.api.zip'))
                }
            }
        }
    }
}

// Starsector 0.98a runs on Java 17
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

// build everything and make a jar
build {
    doLast {
        copy {
            from jar
            into '.'
        }
    }
}

// compile time dependencies - the game provides all of these at runtime
dependencies {
    compileOnly fileTree(dir: starsectorCore, include: ['*.jar'])

    // test only
    testImplementation 'junit:junit:4.13.2'
}

// create a release zip
tasks.register('release', Zip) {
    def jsonFile = file('assets/mod_info.json')
    def parsedJson = new groovy.json.JsonSlurper().parse(jsonFile)
    dependsOn build
    archiveFileName = "${project.name}-${parsedJson.version}.zip"
    destinationDirectory = file(rootDir)
    from 'assets'
    from jar
    into project.name
}

// copy the mod straight into the game's mods folder
tasks.register('installMod', Copy) {
    dependsOn build
    from 'assets'
    from jar
    into new File(starsectorDir, "mods/${project.name}")
}
